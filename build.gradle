plugins {
    id "dev.architectury.loom" version "1.5.391"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "maven-publish"
}

sourceSets {
    clientSmoke
}
sourceSets.clientSmoke.compileClasspath = sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.clientSmoke.runtimeClasspath = sourceSets.clientSmoke.output + sourceSets.main.output + sourceSets.main.runtimeClasspath

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

def normalizeMixinRefmap = tasks.register("normalizeMixinRefmap") {
    dependsOn compileJava

    doLast {
        def refmap = layout.buildDirectory.file("classes/java/main/${project.archives_base_name}-refmap.json").get().asFile
        if (!refmap.isFile()) {
            throw new GradleException("Missing generated mixin refmap: ${refmap}")
        }

        def sortJson
        sortJson = { value ->
            if (value instanceof Map) {
                def sorted = new TreeMap<String, Object>()
                value.each { key, child -> sorted.put(key.toString(), sortJson(child)) }
                return sorted
            }
            if (value instanceof List) {
                return value.collect { child -> sortJson(child) }
            }
            return value
        }

        def parsed = new groovy.json.JsonSlurper().parse(refmap)
        def normalized = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sortJson(parsed)))
        refmap.setText(normalized + "\n", "UTF-8")
    }
}

def verifyAudioLibraries = tasks.register("verifyAudioLibraries") {
    inputs.files(configurations.shadowCommon)

    doLast {
        def files = configurations.shadowCommon.files
        if (files.size() != 2) {
            throw new GradleException("Expected two audio libraries, found ${files.size()}")
        }

        def expectedHashes = [
            'jlayer-1.0.1.jar': '850508c837454a1b06017c32a36876fae516de1e89a829f725fee1e6dcc52000',
            'jaad-0.8.7.jar': 'f6a179169c390e939d737435268406ff6d681af6c6e50a219ce473318174037f'
        ]
        files.each { file ->
            def actual = java.util.HexFormat.of().formatHex(
                    java.security.MessageDigest.getInstance("SHA-256").digest(file.bytes))
            if (actual != expectedHashes[file.name]) {
                throw new GradleException("Audio library SHA-256 mismatch: ${file.name}")
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    dependsOn normalizeMixinRefmap

    from(rootProject.file("LICENSE")) {
        into "META-INF"
        rename { "LICENSE_RE-ETCHED" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}

loom {
    runs {
        clientSmoke {
            environment "client"
            forgeTemplate "client"
            source sourceSets.main
            runDir "build/run-client-smoke"
            property "fabric.dli.env", "client"
            mods {
                "${project.mod_id}" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.clientSmoke
                }
            }
        }
    }

    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfigs = [
                "${project.mod_id}.mixins.json"
        ]
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

configurations {
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    shadowCommon(implementation("javazoom:jlayer:1.0.1"))
    forgeRuntimeLibrary("javazoom:jlayer:1.0.1")

    shadowCommon(implementation("de.sfuhrm:jaad:0.8.7"))
    forgeRuntimeLibrary("de.sfuhrm:jaad:0.8.7")

    testImplementation(platform("org.junit:junit-bom:5.13.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_version", project.mod_version
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_description", project.mod_description
    inputs.property "archives_base_name", project.archives_base_name

    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "forge_loader_version", project.forge_loader_version
    inputs.property "forge_version", project.forge_version

    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "mod_name": project.mod_name,
                "mod_description": project.mod_description,
                "minecraft_version": project.minecraft_version,
                "archives_base_name": project.archives_base_name,
                "forge_loader_version": project.forge_loader_version,
                "forge_version": project.forge_version
    }
}

shadowJar {
    dependsOn verifyAudioLibraries
    configurations = [project.configurations.shadowCommon]
    relocate "javazoom", "gg.moonflower.etched.javazoom"
    relocate "net.sourceforge.jaad", "gg.moonflower.etched.jaad"
    // Use the decoder directly; do not register bundled codecs in global Java Sound discovery.
    exclude "META-INF/services/javax.sound.sampled.spi.*"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Isolated native regression check; fixtures never enter the distributable JAR.
tasks.named("runClientSmoke", JavaExec) {
    group = "verification"
    dependsOn tasks.named("clientSmokeClasses")
    doFirst {
        def directory = layout.buildDirectory.dir("run-client-smoke").get().asFile
        directory.mkdirs()
        delete(new File(directory, "radio-stall-result.txt"))
        new File(directory, "options.txt").text = "version:3465\nonboardAccessibility:false\nnarrator:0\npauseOnLostFocus:false\nenableVsync:false\nmaxFps:60\n"
    }
    doLast {
        def result = layout.buildDirectory.file("run-client-smoke/radio-stall-result.txt").get().asFile
        if (!result.isFile() || !result.text.startsWith("PASS")) {
            throw new GradleException("Radio stall client regression did not pass: " + (result.isFile() ? result.text : "no result"))
        }
        logger.lifecycle(result.text)
    }
}
