plugins {
    id "dev.architectury.loom" version "1.5.391"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "maven-publish"
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    gameTest
}

sourceSets.gameTest.compileClasspath =
        sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gameTest.runtimeClasspath =
        sourceSets.gameTest.output + sourceSets.main.output + sourceSets.main.runtimeClasspath

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

def normalizeMixinRefmap = tasks.register("normalizeMixinRefmap") {
    dependsOn compileJava

    doLast {
        def refmap = layout.buildDirectory.file("classes/java/main/${project.archives_base_name}-refmap.json").get().asFile
        if (!refmap.isFile()) {
            throw new GradleException("Missing generated mixin refmap: ${refmap}")
        }

        def sortJson
        sortJson = { value ->
            if (value instanceof Map) {
                def sorted = new TreeMap<String, Object>()
                value.each { key, child -> sorted.put(key.toString(), sortJson(child)) }
                return sorted
            }
            if (value instanceof List) {
                return value.collect { child -> sortJson(child) }
            }
            return value
        }

        def parsed = new groovy.json.JsonSlurper().parse(refmap)
        def normalized = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(sortJson(parsed)))
        refmap.setText(normalized + "\n", "UTF-8")
    }
}

def verifyJlayerBinary = tasks.register("verifyJlayerBinary") {
    inputs.files(configurations.shadowCommon)

    doLast {
        def files = configurations.shadowCommon.files
        if (files.size() != 1) {
            throw new GradleException("Expected one JLayer binary, found ${files.size()}")
        }

        def actual = java.util.HexFormat.of().formatHex(
                java.security.MessageDigest.getInstance("SHA-256").digest(files.first().bytes))
        def expected = "850508c837454a1b06017c32a36876fae516de1e89a829f725fee1e6dcc52000"
        if (actual != expected) {
            throw new GradleException("JLayer 1.0.1 SHA-256 mismatch: ${actual}")
        }
    }
}

tasks.withType(Jar).configureEach {
    dependsOn normalizeMixinRefmap

    from(rootProject.file("LICENSE")) {
        into "META-INF"
        rename { "LICENSE_RE-ETCHED" }
    }
    from(rootProject.file("THIRD_PARTY_NOTICES.md")) {
        into "META-INF"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfigs = [
                "${project.mod_id}.mixins.json"
        ]
    }

    runs {
        gameTestServer {
            // Loom lowercases environment names, but Forge's launch config keeps this section camel-cased.
            environment "server"
            forgeTemplate "gameTestServer"
            name "Minecraft Game Test Server"
            source sourceSets.main
            runDir "build/run-game-test"
            property "fabric.dli.env", "gameTestServer"
            property "forge.enabledGameTestNamespaces", project.mod_id

            mods {
                "${project.mod_id}" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gameTest
                }
            }
        }
    }
}

repositories {
    mavenLocal()
}

configurations {
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    shadowCommon(implementation("javazoom:jlayer:1.0.1"))
    forgeRuntimeLibrary("javazoom:jlayer:1.0.1")

    testImplementation(platform("org.junit:junit-bom:5.13.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

def prepareGameTestStructures = tasks.register("prepareGameTestStructures", Sync) {
    from("src/gameTest/gameteststructures")
    into(layout.buildDirectory.dir("run-game-test/gameteststructures"))
}

def gameTestSuccessMarker = layout.buildDirectory.file("run-game-test/etched-gametest-success")

tasks.named("runGameTestServer", JavaExec) {
    group = "verification"
    description = "Runs Forge GameTests in the transformed Forge userdev server"
    dependsOn tasks.named("classes")
    dependsOn tasks.named("gameTestClasses")
    dependsOn prepareGameTestStructures

    doFirst {
        delete(gameTestSuccessMarker)
    }
    doLast {
        def marker = gameTestSuccessMarker.get().asFile
        if (!marker.isFile()) {
            throw new GradleException("Forge GameTest server exited without running the Etched smoke test")
        }
        delete(marker)
    }
}

processResources {
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_version", project.mod_version
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_description", project.mod_description
    inputs.property "archives_base_name", project.archives_base_name

    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "forge_loader_version", project.forge_loader_version
    inputs.property "forge_version", project.forge_version

    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand "mod_id": project.mod_id,
                "mod_version": project.mod_version,
                "mod_name": project.mod_name,
                "mod_description": project.mod_description,
                "minecraft_version": project.minecraft_version,
                "archives_base_name": project.archives_base_name,
                "forge_loader_version": project.forge_loader_version,
                "forge_version": project.forge_version
    }
}

shadowJar {
    dependsOn verifyJlayerBinary
    configurations = [project.configurations.shadowCommon]
    relocate "javazoom", "gg.moonflower.etched.javazoom"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
