name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.assets.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify release tag
        shell: bash
        run: |
          version=""
          while IFS='=' read -r key value; do
            if [[ "$key" == "mod_version" ]]; then
              version="$value"
              break
            fi
          done < gradle.properties

          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match mod_version %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            printf 'Release tag %s must be annotated\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          case "$version" in
            4.*) release_branch="4.x" ;;
            5.*) release_branch="master" ;;
            *)
              printf 'Unsupported release line for version %s\n' "$version" >&2
              exit 1
              ;;
          esac

          release_ref="refs/remotes/origin/$release_branch"
          if ! git show-ref --verify --quiet "$release_ref"; then
            printf 'Release branch origin/%s was not fetched\n' "$release_branch" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$release_ref"; then
            printf 'Tagged commit %s is not on origin/%s\n' "$GITHUB_SHA" "$release_branch" >&2
            exit 1
          fi

      - name: Clean, test, and build
        run: ./gradlew clean test build --no-daemon

      - name: Extract version changelog for CurseForge
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## |\Z)'
          sections = list(re.finditer(pattern, changelog, re.MULTILINE | re.DOTALL))
          if len(sections) != 1 or not sections[0]['body'].strip():
              raise SystemExit(f'Expected one non-empty CHANGELOG.md section for {version}')
          Path('CURSEFORGE_CHANGELOG.md').write_text(
              sections[0].group().rstrip() + '\n', encoding='utf-8')
          PY

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/re-etched-*.jar)
          production=()

          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-dev-shadow.jar) ;;
              *) production+=("$jar") ;;
            esac
          done

          if (( ${#production[@]} != 1 )); then
            printf 'Expected exactly one production JAR, found %d\n' "${#production[@]}" >&2
            printf '%s\n' "${production[@]}" >&2
            exit 1
          fi

          mkdir release
          jar_name="${production[0]##*/}"
          cp "${production[0]}" "release/$jar_name"
          jar_sha256="$(sha256sum "release/$jar_name")"
          printf '%s  %s\n' "${jar_sha256%% *}" "$jar_name" > "release/$jar_name.sha256"

          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs
          path: |
            release
            RELEASE_NOTES.md
            CURSEFORGE_CHANGELOG.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-inputs
          path: staging

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "${{ needs.build.outputs.version }}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" staging/release/* \
            --verify-tag \
            --title "Re-Etched ${{ needs.build.outputs.version }} for Forge 1.20.1" \
            --notes-file staging/RELEASE_NOTES.md \
            "${prerelease[@]}"

  publish-curseforge:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check CurseForge credentials
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            printf '::error::Add the CURSEFORGE_TOKEN repository secret to enable CurseForge uploads.\n'
            exit 1
          fi

      - name: Download verified release inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-inputs
          path: staging

      - name: Verify CurseForge upload
        id: curseforge
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd staging/release
          jar_name="re-etched-$VERSION.jar"
          test -f "$jar_name"
          sha256sum --check "$jar_name.sha256"
          test -s ../CURSEFORGE_CHANGELOG.md

          case "$VERSION" in
            *-alpha*) release_type=alpha ;;
            *-*) release_type=beta ;;
            *) release_type=release ;;
          esac
          printf 'release_type=%s\n' "$release_type" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        id: upload
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: '1740768'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: staging/release/re-etched-${{ needs.build.outputs.version }}.jar
          name: Re-Etched ${{ needs.build.outputs.version }} — Forge 1.20.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ steps.curseforge.outputs.release_type }}
          changelog-file: staging/CURSEFORGE_CHANGELOG.md
          loaders: forge
          game-versions: '1.20.1'
          java: '17'
          environment: client | server
          # A lost upload response is ambiguous; inspect CurseForge before retrying.
          retry-attempts: 1
          fail-mode: fail

      - name: Record CurseForge file
        shell: bash
        env:
          FILE_ID: ${{ steps.upload.outputs.curseforge-version }}
        run: |
          if [[ ! "$FILE_ID" =~ ^[0-9]+$ ]]; then
            printf '::error::CurseForge upload did not return a file ID.\n'
            exit 1
          fi
          printf 'CurseForge upload accepted: [file %s](https://www.curseforge.com/minecraft/mc-mods/re-etched/files/%s). Availability depends on CurseForge processing and moderation.\n' \
            "$FILE_ID" "$FILE_ID" >> "$GITHUB_STEP_SUMMARY"
