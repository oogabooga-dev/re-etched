name: Build

on:
  push:
    branches:
      - master
      - 4.x
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and build
        run: ./gradlew test build --no-daemon

      - name: Run transformed Forge GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Smoke-test client startup
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./gradlew runClientSmoke --no-daemon

      - name: Smoke-test dedicated server
        run: python3 scripts/server_smoke.py

      - name: Upload server failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dedicated-server-failure-logs
          path: |
            build/run-game-test/logs
            build/run-game-test/crash-reports
            build/run-client-smoke/logs
            build/run-client-smoke/crash-reports
            run/logs
            run/crash-reports
          if-no-files-found: ignore

      - name: Locate production JAR
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/re-etched-*.jar)
          production=()

          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-dev-shadow.jar) ;;
              *) production+=("$jar") ;;
            esac
          done

          if (( ${#production[@]} != 1 )); then
            printf 'Expected exactly one production JAR, found %d\n' "${#production[@]}" >&2
            printf '%s\n' "${production[@]}" >&2
            exit 1
          fi

          printf 'path=%s\n' "${production[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload production JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: re-etched-production
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
